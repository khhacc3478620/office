<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辦公室待辦事項APP</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background-color: #f4f6f8; color: #333; margin: 0; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .form-card { background: #ffffff; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid #00c300; }
    .overdue { border-left: 6px solid #ff4d4f; }
    .today { border-left: 6px solid #1890ff; }
    .btn { background: #00c300; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn:disabled { background: #ccc; }
    .btn-submit { background: #00c300; font-size: 16px; padding: 10px; }
    .btn-copy { background: #4a90e2; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; margin-top: 6px; display: inline-block; }
    .tag { font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #eee; margin-left: 6px; }
    input, select { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    label { font-weight: bold; font-size: 14px; color: #444; }
  </style>
</head>
<body>
  <div style="padding: 10px;">
    <h2>📋 辦公室待辦清單</h2>
    <div id="user-info-box" style="background: #eef6ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; color: #333;">
      <div id="user-info">載入個人資訊中...</div>
      <button class="btn-copy" id="copy-id-btn" onclick="copyUserId()" style="display:none;">📋 複製我的 LINE ID</button>
    </div>

    <!-- ➕ 新增事項表單區 -->
    <div class="form-card">
      <h3 style="margin-top: 0; color: #00c300;">➕ 新增/指派工作事項</h3>
      <form id="add-task-form">
        <label>工作事項名稱：</label>
        <input type="text" id="task-title" placeholder="請輸入任務內容（例：聯絡廠商報價）" required>

        <label>指派對象（負責人）：</label>
        <select id="assignee-name" required>
          <option value="">-- 請選擇同仁/主任 --</option>
          <option value="法桂蘭 主任">法桂蘭 主任</option>
          <option value="簡文章">簡文章</option>
          <option value="黃鈺茹">黃鈺茹</option>
          <option value="蔡鳳媛">蔡鳳媛</option>
          <option value="呂政家">呂政家</option>
          <option value="邱瓊玉">邱瓊玉</option>
          <option value="林美君">林美君</option>
          <option value="蔡勝木">蔡勝木</option>
        </select>

        <label>截止日期：</label>
        <input type="date" id="due-date" required>

        <label>優先級：</label>
        <select id="priority">
          <option value="普通">普通</option>
          <option value="高">緊急 (高)</option>
          <option value="低">不急 (低)</option>
        </select>

        <button type="submit" class="btn btn-submit" id="submit-btn">發布工作事項</button>
      </form>
    </div>

    <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">

    <h3>📌 目前全辦公室待辦事項</h3>
    <div id="task-list">讀取資料中...</div>
  </div>

  <script>
    const LIFF_ID = "2011358448-vLzZzpKP";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz3rHLER3WWcfiQsUom1d6YbLM2gViEWY77D7sbdvIYucdvzzZCPkFEZBk5qYN0E70XRw/exec"; 

    let currentUser = {};

    async function initLIFF() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          currentUser = { id: profile.userId, name: profile.displayName };
          document.getElementById('user-info').innerText = `👤 操作者：${currentUser.name}`;
          document.getElementById('copy-id-btn').style.display = 'inline-block';
          
          const today = new Date().toISOString().split('T')[0];
          document.getElementById('due-date').value = today;

          loadTasks();
        }
      } catch (err) {
        document.getElementById('user-info').innerText = "LIFF 初始化失敗：" + err.message;
      }
    }

    function copyUserId() {
      if (currentUser.id) {
        navigator.clipboard.writeText(currentUser.id).then(() => {
          alert("✅ 已複製您的 LINE ID！請將這串 ID 貼給管理員填入試算表中。");
        }).catch(() => {
          prompt("您的 LINE ID 為（請手動複製）：", currentUser.id);
        });
      }
    }

    function loadTasks() {
      const container = document.getElementById('task-list');
      container.innerHTML = '正在讀取最新待辦事項...';

      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = GAS_URL + '?callback=handleData&t=' + new Date().getTime();
      document.body.appendChild(script);
      
      script.onerror = function() {
        container.innerHTML = '資料讀取失敗，請確認網路與後端設定。';
      };
    }

    window.handleData = function(data) {
      if (data && data.tasks) {
        renderTasks(data.tasks);
      } else {
        document.getElementById('task-list').innerHTML = '資料讀取異常。';
      }
    };

    function renderTasks(tasks) {
      const container = document.getElementById('task-list');
      container.innerHTML = '';
      
      const activeTasks = tasks.filter(t => t.status !== 'Completed');
      
      if (activeTasks.length === 0) {
        container.innerHTML = '<div class="card">🎉 太棒了！目前沒有未完成的事項。</div>';
        return;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      activeTasks.forEach(t => {
        const div = document.createElement('div');
        const isOverdue = t.dueDate && t.dueDate < todayStr;
        div.className = `card ${isOverdue ? 'overdue' : 'today'}`;
        
        let displayDate = t.dueDate || '未設定';
        if (displayDate.includes('T')) {
          displayDate = displayDate.split('T')[0];
        }

        div.innerHTML = `
          <h3 style="margin: 0 0 8px 0;">${t.title} <span class="tag">${t.priority || '普通'}優先</span></h3>
          <p style="margin: 4px 0; color: #1890ff; font-size: 15px; font-weight: bold;">👤 負責人：${t.assigneeName}</p>
          <p style="margin: 4px 0; color: #666; font-size: 14px;">📅 截止日：${displayDate} ${isOverdue ? '<b style="color:red;">(已逾期)</b>' : ''}</p>
          <p style="margin: 4px 0 12px 0; color: #888; font-size: 12px;">✍️ 指派人：${t.creatorName}</p>
          <button class="btn" onclick="completeTask('${t.id}', this)">標示為已完成</button>
        `;
        container.appendChild(div);
      });
    }

    async function completeTask(taskId, btn) {
      btn.disabled = true;
      btn.innerText = "更新中...";

      const formData = new FormData();
      formData.append('action', 'complete');
      formData.append('taskId', taskId);

      await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: formData });
      setTimeout(loadTasks, 1500);
    }

    document.getElementById('add-task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "發布中...";

      const formData = new FormData();
      formData.append('action', 'add');
      formData.append('title', document.getElementById('task-title').value);
      formData.append('assigneeName', document.getElementById('assignee-name').value);
      formData.append('creatorName', currentUser.name || '同仁');
      formData.append('dueDate', document.getElementById('due-date').value);
      formData.append('priority', document.getElementById('priority').value);

      try {
        await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: formData });
        alert("✅ 工作事項發布成功！");
        document.getElementById('task-title').value = '';
        document.getElementById('assignee-name').value = '';
      } catch (err) {
        alert("發布失敗，請重試：" + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "發布工作事項";
        setTimeout(loadTasks, 1500);
      }
    });

    initLIFF();
  </script>
</body>
</html>
