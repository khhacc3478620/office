<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辦公室待辦事項APP</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background-color: #f4f6f8; color: #333; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .overdue { border-left: 6px solid #ff4d4f; }
    .today { border-left: 6px solid #1890ff; }
    .btn { background: #00c300; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn:disabled { background: #ccc; }
    .tag { font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #eee; margin-left: 6px; }
  </style>
</head>
<body>
  <h2>📋 辦公室待辦清單</h2>
  <div id="user-info" style="font-weight: bold; margin-bottom: 15px; color: #555;">載入個人資訊中...</div>
  <hr style="border: none; border-top: 1px solid #eee; margin-bottom: 15px;">
  <div id="task-list">讀取資料中...</div>

  <script>
    // 2011358448-vLzZzpKP與https://script.google.com/macros/s/AKfycbzWUyO2md8WI7GvDNEpnzm7ErC637sZW3YN2rgXBtRfeOdOoOGGHnVuShiAC0vIV9i1Gw/exec
    const LIFF_ID = "2011358448-vLzZzpKP";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzWUyO2md8WI7GvDNEpnzm7ErC637sZW3YN2rgXBtRfeOdOoOGGHnVuShiAC0vIV9i1Gw/exec"; 

    let currentUser = {};

    async function initLIFF() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          currentUser = { id: profile.userId, name: profile.displayName };
          document.getElementById('user-info').innerText = `👤 使用者：${currentUser.name}`;
          loadTasks();
        }
      } catch (err) {
        document.getElementById('user-info').innerText = "LIFF 初始化失敗：" + err.message;
      }
    }

    async function loadTasks() {
      const container = document.getElementById('task-list');
      container.innerHTML = '正在讀取最新待辦事項...';
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'get' })
        });
        const data = await res.json();
        renderTasks(data.tasks);
      } catch (err) {
        container.innerHTML = '資料讀取失敗，請確認後端設定。';
      }
    }

    function renderTasks(tasks) {
      const container = document.getElementById('task-list');
      container.innerHTML = '';
      
      // 篩選出指派給當前使用者且未完成的任務
      const myTasks = tasks.filter(t => t.assigneeId === currentUser.id && t.status !== 'Completed');
      
      if (myTasks.length === 0) {
        container.innerHTML = '<div class="card">🎉 太棒了！您目前沒有未完成的待辦事項。</div>';
        return;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      myTasks.forEach(t => {
        const div = document.createElement('div');
        const isOverdue = t.dueDate < todayStr;
        div.className = `card ${isOverdue ? 'overdue' : 'today'}`;
        div.innerHTML = `
          <h3 style="margin: 0 0 8px 0;">${t.title} <span class="tag">${t.priority}優先</span></h3>
          <p style="margin: 4px 0; color: #666; font-size: 14px;">📅 截止日：${t.dueDate.split('T')[0]}</p>
          <p style="margin: 4px 0 12px 0; color: #666; font-size: 14px;">👤 指派人：${t.creatorName}</p>
          <button class="btn" onclick="completeTask('${t.id}', this)">標示為完成</button>
        `;
        container.appendChild(div);
      });
    }

    async function completeTask(taskId, btn) {
      btn.disabled = true;
      btn.innerText = "更新中...";
      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'complete', taskId: taskId })
      });
      loadTasks();
    }

    initLIFF();
  </script>
</body>
</html>
